name: pharmacy-management-system

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharmacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharmacy_Strong1!}
      POSTGRES_DB: ${POSTGRES_DB:-pharmacy}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharmacy} -d ${POSTGRES_DB:-pharmacy}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pharma]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pharma]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-pharmacy}:${POSTGRES_PASSWORD:-pharmacy_Strong1!}@postgres:5432/${POSTGRES_DB:-pharmacy}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 random chars)}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:${APP_PORT:-8080}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@pharmacy.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Pharmacy Admin}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [pharma]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    networks: [pharma]

volumes:
  pgdata:
  redisdata:

networks:
  pharma:
    driver: bridge
