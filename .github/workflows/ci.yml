name: CI — test gates + production builds

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend — integration suite + coverage gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmacy
          POSTGRES_PASSWORD: pharmacy_Strong1!
          POSTGRES_DB: pharmacy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pharmacy -d pharmacy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgresql://pharmacy:pharmacy_Strong1!@localhost:5432/pharmacy_test?schema=public
          DATABASE_URL: postgresql://pharmacy:pharmacy_Strong1!@localhost:5432/pharmacy_test?schema=public
          JWT_SECRET: ci-test-secret-min-32-chars-abcdef
          NODE_ENV: test

  frontend:
    name: Frontend — unit suite + coverage gate + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: E2E — full stack on Docker Compose + Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate secrets
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48)|" .env
      - name: Start full stack
        run: docker compose up -d --build
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T backend wget -q -O- http://127.0.0.1:4000/ready && break
            sleep 5
          done
      - name: Seed demo data
        run: docker compose exec -T backend npm run db:seed
      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E suite
        working-directory: frontend
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --tail=200 backend frontend
      - name: Tear down
        if: always()
        run: docker compose down -v
